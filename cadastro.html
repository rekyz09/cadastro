<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="card" id="form-cadastro">
    <h2>Cadastro</h2>

    <div class="imagem">
      <div class="previa" id="previa">Sem imagem</div>
      <input type="file" id="imagem" accept="image/*">
      <button type="button" class="btn secundario" id="btn-imagem">Inserir imagem</button>
    </div>

    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>
    </div>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
    </div>
    <div class="campo">
      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" required>
    </div>
    <div class="campo">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
    </div>

    <button type="submit" class="btn principal">Salvar informações</button>
    <a class="voltar" href="index.html">Voltar</a>
  </form>

  <script src="script.js"></script>
</body>
</html>
